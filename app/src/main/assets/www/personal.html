<title>دخل و خرج شخصی</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--line:#dde3ee;--pri:#16407f;--pri2:#e8eefa;--txt:#1b2333;--mut:#6b7587;--inc:#1e8449;--incbg:#e6f4ea;--exp:#c0392b;--expbg:#fdecea;--sav:#2471a3;--warn:#b9770e;--warnbg:#fef5e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding-bottom:78px}
header.top{position:sticky;top:40px;z-index:20;background:linear-gradient(135deg,#16407f,#1f5fb8);color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hrow h1{font-size:15px;margin:0;flex:1;font-weight:bold}
.mnav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.mnav button{background:none;border:0;color:#fff;font-size:15px;padding:6px 10px;border-radius:8px;cursor:pointer}
.mnav button:active{background:rgba(255,255,255,.25)}
.mnav #mlabel{min-width:104px;text-align:center;font-weight:bold;font-size:14px}
.today{font-size:12px!important;background:rgba(255,255,255,.2)!important}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.card h3 small{color:var(--mut);font-weight:normal;font-size:11px;margin-right:auto}
.hero{background:linear-gradient(135deg,#16407f,#2a6fd0);color:#fff;border:0}
.hero .lbl{font-size:12px;opacity:.85}
.hero .big{font-size:28px;font-weight:bold;margin:2px 0 10px}
.hero .big.neg{color:#ffb4a8}
.hero .sub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hero .sub div{background:rgba(255,255,255,.12);border-radius:9px;padding:7px 8px;font-size:11px}
.hero .sub b{display:block;font-size:13px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
.kpi small{color:var(--mut);font-size:11px;display:block}
.kpi b{font-size:17px;display:block;margin:3px 0}
.kpi i{font-style:normal;font-size:11px;color:var(--mut)}
.good{color:var(--inc)!important}.bad{color:var(--exp)!important}.warn{color:var(--warn)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.two{grid-template-columns:1fr}.hero .sub{grid-template-columns:1fr 1fr}}
.alert{border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.alert.r{background:var(--expbg);color:var(--exp)}.alert.y{background:var(--warnbg);color:var(--warn)}.alert.g{background:var(--incbg);color:var(--inc)}
.donutw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;top:28px;right:28px;bottom:28px;left:28px;inset:28px;background:#fff;border-radius:50%}
.legend{flex:1;min-width:150px;font-size:12px}
.legend div{display:flex;align-items:center;gap:6px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1}.legend em{font-style:normal;color:var(--mut)}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--pri2);font-size:11px;padding:7px 5px;border:1px solid var(--line);white-space:nowrap}
table.t td{border:1px solid var(--line);padding:6px 6px;font-size:13px}
table.t td.n{text-align:left;direction:ltr;white-space:nowrap}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover{background:var(--pri2)}
table.t tfoot td{font-weight:bold;background:#f6f8fc}
.wrap{overflow-x:auto}
.bar{height:8px;background:#e9edf4;border-radius:5px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--sav);border-radius:5px}
.bar>i.over{background:var(--exp)}.bar>i.ok{background:var(--inc)}
.brow{padding:7px 0;border-bottom:1px solid #eef1f6;font-size:13px}
.brow:last-child{border:0}
.brow .l{display:flex;justify-content:space-between;gap:8px}
.brow small{color:var(--mut)}
button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer}
button:active{background:var(--pri2)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.inc{background:var(--inc);border-color:var(--inc);color:#fff}
button.exp{background:var(--exp);border-color:var(--exp);color:#fff}
button.dg{color:var(--exp)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input,select{font-family:inherit;font-size:14px;color:var(--txt)}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.qa input,.qa select{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.qa .a{flex:1 1 130px;direction:ltr;text-align:left;font-weight:bold}
.qa .c{flex:1 1 120px}.qa .t{flex:2 1 150px}.qa .d{flex:0 0 100px;direction:ltr;text-align:center}
.er{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid #eef1f6;align-items:center}
.er input,.er select{border:1px solid transparent;background:#f6f8fc;border-radius:7px;padding:8px 7px;min-width:0}
.er input:focus,.er select:focus{outline:2px solid var(--pri);background:#fffdf3}
.er .t{flex:2 1 140px}.er .c{flex:1 1 105px}.er .d{flex:0 0 94px;direction:ltr;text-align:center}.er .a{flex:1 1 100px;direction:ltr;text-align:left;font-weight:bold}
.er .x{color:var(--exp);border:0;background:none;padding:6px 8px}
.er .tg{border:1px solid var(--line);padding:6px 8px;color:var(--mut)}
.er .tg.on{background:var(--pri2);color:var(--pri);border-color:var(--pri);font-weight:bold}
.tot{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;font-weight:bold}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.hint{color:var(--mut);font-size:12px}
.fld{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
.fld input,.fld select{display:block;width:100%;margin-top:3px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.fld input.ltr{direction:ltr;text-align:right}
.crow{display:flex;gap:6px;margin-bottom:6px}
.crow input{padding:8px;border:1px solid var(--line);border-radius:7px;min-width:0}
.crow .n{flex:2}.crow .b{flex:1;direction:ltr;text-align:left}
nav.tabs{position:fixed;bottom:0;right:0;left:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--pri);font-weight:bold;background:var(--pri2)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:99;font-size:13px}
svg{max-width:100%;height:auto;display:block}
.chart text{font-family:Tahoma,Arial;font-size:10px;fill:#6b7587}
#printArea{display:none}
.pf{font-family:Tahoma,Arial,sans-serif;color:#000;font-size:11pt}
.pf h1{text-align:center;font-size:15pt;margin:0 0 4px}.pf .sub{text-align:center;margin-bottom:10px;font-size:10.5pt}
.pf table{width:100%;border-collapse:collapse;margin-bottom:10px}
.pf th,.pf td{border:1px solid #000;padding:4px 6px;font-size:10pt}.pf th{background:#e6e6e6}
.pf td.n{text-align:left;white-space:nowrap}.pf td.c{text-align:center}.pf tfoot td{font-weight:bold;background:#f0f0f0}
.pf h2{font-size:12pt;margin:10px 0 4px}.pf tr{page-break-inside:avoid}
@media print{@page{size:A4;margin:12mm}body{background:#fff;padding:0}#app,.toast{display:none!important}#printArea{display:block}}

.er .p{flex:1 1 92px;direction:ltr;text-align:left}
.er .q,.qa .q{flex:0 0 62px;text-align:center;direction:ltr}
.er .tt,.qa .tt{flex:1 1 96px;font-weight:bold;text-align:left;direction:ltr;padding:8px 4px;color:var(--exp)}
.qa .tt{flex:0 0 auto;align-self:center;padding:0 4px;font-size:13px}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:12px;overflow:auto}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:16px;width:760px;max-width:100%;margin:auto}
.modal h3{margin:0 0 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mapg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.mapg .fld{margin:0}
.pv td.n{direction:ltr}
.chip{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px}
.chip.e{background:var(--expbg);color:var(--exp)}.chip.i{background:var(--incbg);color:var(--inc)}.chip.w{background:var(--warnbg);color:var(--warn)}
.swbar{position:sticky;top:0;z-index:100;display:flex;gap:4px;background:#0e2a57;padding:4px;height:40px;box-sizing:border-box}
.swbar a{flex:1;display:flex;align-items:center;justify-content:center;color:#cdd9ee;text-decoration:none;border-radius:8px;font-size:13px;font-family:Tahoma,Arial,sans-serif}
.swbar a.on{background:#fff;color:#16407f;font-weight:bold}
</style>

<script>
//#XLSX-START
/* ---------- کتابخانه کوچک خواندن/نوشتن xlsx (بدون نیاز به اینترنت) ---------- */
const _enc=new TextEncoder(), _dec=new TextDecoder();
const _CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=_CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function xmlUnesc(s){return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d)).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}

function zipStore(files){
  const parts=[],cds=[];let off=0;
  const dDate=((2026-1980)<<9)|(1<<5)|1;
  for(const f of files){
    const name=_enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);
    v.setUint16(10,0,true);v.setUint16(12,dDate,true);v.setUint32(14,crc,true);v.setUint32(18,sz,true);v.setUint32(22,sz,true);
    v.setUint16(26,name.length,true);v.setUint16(28,0,true);lh.set(name,30);
    parts.push(lh,f.data);
    const ch=new Uint8Array(46+name.length),c=new DataView(ch.buffer);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,0,true);c.setUint16(14,dDate,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);
    c.setUint16(28,name.length,true);c.setUint32(42,off,true);ch.set(name,46);
    cds.push(ch);off+=lh.length+sz;
  }
  let cdSize=0;for(const c of cds)cdSize+=c.length;
  const e=new Uint8Array(22),ev=new DataView(e.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  const all=[...parts,...cds,e];let tot=0;for(const p of all)tot+=p.length;
  const out=new Uint8Array(tot);let o=0;for(const p of all){out.set(p,o);o+=p.length}
  return out;
}
async function inflateRaw(u){
  const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(u){
  const v=new DataView(u.buffer,u.byteOffset,u.byteLength);
  let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(v.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('فایل xlsx معتبر نیست');
  const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)throw new Error('ساختار zip خراب است');
    const method=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    const name=_dec.decode(u.subarray(p+46,p+46+nl));
    const lnl=v.getUint16(lo+26,true),lel=v.getUint16(lo+28,true),ds=lo+30+lnl+lel;
    const raw=u.subarray(ds,ds+cs);
    out[name]=method===0?raw:method===8?await inflateRaw(raw):null;
    p+=46+nl+el+cl;
  }
  return out;
}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function colIndex(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1}
function sheetXml(sh){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
  if(sh.widths)x+='<cols>'+sh.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  x+='<sheetData>';
  sh.rows.forEach((r,ri)=>{
    x+=`<row r="${ri+1}">`;
    r.forEach((c,ci)=>{
      if(c===null||c===undefined||c==='')return;
      const ref=colName(ci)+(ri+1);
      if(ri===0)x+=`<c r="${ref}" s="1" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`;
      else if(typeof c==='number')x+=`<c r="${ref}" s="2"><v>${c}</v></c>`;
      else x+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`;
    });
    x+='</row>';
  });
  return x+'</sheetData></worksheet>';
}
function buildXlsx(sheets){
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const f=[];
  const add=(n,s)=>f.push({name:n,data:_enc.encode(s)});
  add('[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>');
  add('_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add('xl/workbook.xml',H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add('xl/styles.xml',H+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E2F3"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment horizontal="center"/></xf><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`,sheetXml(s)));
  return zipStore(f);
}
function _attr(tag,name){const m=new RegExp('(?:^|\\s)'+name+'="([^"]*)"').exec(tag);return m?xmlUnesc(m[1]):null}
function _tText(x){let s='';const re=/<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;let m;while((m=re.exec(x)))s+=m[1]?xmlUnesc(m[1]):'';return s}
async function readXlsx(buf){
  const files=await unzip(new Uint8Array(buf));
  const txt=n=>files[n]?_dec.decode(files[n]):null;
  const wb=txt('xl/workbook.xml'),rels=txt('xl/_rels/workbook.xml.rels');
  if(!wb||!rels)throw new Error('این فایل اکسل معتبر نیست');
  const relMap={};(rels.match(/<Relationship\b[^>]*>/g)||[]).forEach(t=>{relMap[_attr(t,'Id')]=_attr(t,'Target')});
  let shared=[];const ss=txt('xl/sharedStrings.xml');
  if(ss){(ss.match(/<si\b[\s\S]*?<\/si>|<si\b[^>]*\/>/g)||[]).forEach(si=>shared.push(_tText(si)))}
  const out=[];
  for(const t of (wb.match(/<sheet\b[^>]*>/g)||[])){
    const name=_attr(t,'name'),rid=_attr(t,'r:id');let tg=relMap[rid]||'';
    tg=tg.replace(/^\//,'');if(!tg.startsWith('xl/'))tg='xl/'+tg;
    const sx=txt(tg);const rows=[];
    if(sx){
      const re=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;let m;
      while((m=re.exec(sx))){
        const at=m[1],body=m[2]||'';const ref=_attr(at,'r');if(!ref)continue;
        const ty=_attr(at,'t');const ri=parseInt(ref.replace(/^[A-Z]+/,''))-1,ci=colIndex(ref);
        let val=null;const vm=/<v>([\s\S]*?)<\/v>/.exec(body);
        if(ty==='inlineStr')val=_tText(body);
        else if(vm){const raw=xmlUnesc(vm[1]);
          if(ty==='s')val=shared[+raw]??'';else if(ty==='str'||ty==='e')val=raw;else if(ty==='b')val=raw==='1'?'TRUE':'FALSE';else{const n=Number(raw);val=isNaN(n)?raw:n}}
        if(val===null||val==='')continue;
        (rows[ri]=rows[ri]||[])[ci]=val;
      }

}
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}

/* مانده از ماه قبل: دستی یا زنجیره‌ای از آخرین ماه ثبت‌شده قبلی */
function carryOf(k){const m=S.months[k];if(m&&m.carry!=null)return Number(m.carry)||0;
  const ks=Object.keys(S.months).filter(x=>x<k).sort();
  return ks.length?closeOf(ks[ks.length-1]):(Number(S.settings.opening)||0)}
function closeOf(k){const m=getM(k);return carryOf(k)+sum(m.inc)-sum(m.exp)}
function stats(k){const m=getM(k),inc=sum(m.inc),exp=sum(m.exp),carry=carryOf(k);
  return{k,inc,exp,carry,net:inc-exp,close:carry+inc-exp,fixedExp:sum(m.exp.filter(x=>x.fix)),has:!!S.months[k]&&(m.inc.length||m.exp.length||m.carry!=null)}}

function dailyChart(k){
  const[y,mon]=pk(k),L=mLen(y,mon),m=getM(k);
  const ci=Array(L+1).fill(0),ce=Array(L+1).fill(0);
  m.inc.forEach(e=>{ci[Math.min(L,dayOf(e.date,mon))]+=Number(e.amount)||0});
  m.exp.forEach(e=>{ce[Math.min(L,dayOf(e.date,mon))]+=Number(e.amount)||0});
  for(let d=2;d<=L;d++){ci[d]+=ci[d-1];ce[d]+=ce[d-1]}
  const totB=S.settings.expCats.reduce((s,c)=>s+(Number(c.b)||0),0);
  const W=640,H=210,pl=10,pr=10,pt=14,pb=24;
  const mx=Math.max(1,ci[L],ce[L],totB);
  const X=d=>W-pr-(d-1)/(L-1)*(W-pl-pr),Yv=v=>H-pb-v/mx*(H-pt-pb);
  const pts=a=>a.slice(1).map((v,i)=>X(i+1).toFixed(1)+','+Yv(v).toFixed(1)).join(' ');
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4,yy=Yv(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#e8ecf3"/><text x="${W-pr}" y="${yy-2}" text-anchor="end">${v>=1e6?fa(Math.round(v/1e5)/10)+'M':v>=1e3?fa(Math.round(v/1e3))+'k':fa(Math.round(v))}</text>`}
  const xl=[1,5,10,15,20,25,L].map(d=>`<text x="${X(d)}" y="${H-8}" text-anchor="middle">${fa(d)}</text>`).join('');
  const bl=totB>0?`<line x1="${pl}" x2="${W-pr}" y1="${Yv(totB)}" y2="${Yv(totB)}" stroke="#d68910" stroke-dasharray="5 4"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr">${g}${bl}<polyline points="${pts(ci)}" fill="none" stroke="#1e8449" stroke-width="2.2"/><polyline points="${pts(ce)}" fill="none" stroke="#c0392b" stroke-width="2.2"/>${xl}</svg>
  <div class="hint" style="margin-top:4px"><span class="good">━</span> درآمد تجمعی &nbsp; <span class="bad">━</span> هزینه تجمعی ${totB>0?'&nbsp; <span class="warn">╌</span> کل بودجه':''}</div>`;
}
function yearChart(y){
  const W=640,H=220,pt=12,pb=26,bw=20,gap=(W-12*bw*2)/13;
  const st=[];for(let i=1;i<=12;i++)st.push(stats(mkKey(y,i)));
  const mx=Math.max(1,...st.map(s=>Math.max(s.inc,s.exp)));
  let b='';
  st.forEach((s,i)=>{const x0=W-gap*(i+1)-bw*2*(i+1);
    const hi=s.inc/mx*(H-pt-pb),he=s.exp/mx*(H-pt-pb);
    b+=`<rect x="${x0+bw}" y="${H-pb-hi}" width="${bw-2}" height="${hi}" rx="3" fill="#1e8449"/><rect x="${x0}" y="${H-pb-he}" width="${bw-2}" height="${he}" rx="3" fill="#c0392b"/><text x="${x0+bw}" y="${H-9}" text-anchor="middle">${fa(i+1)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="direction:ltr"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="#cfd6e3"/>${b}</svg>

}

/* ================= ورود اطلاعات حساب ================= */
let imp=null;
function csvParse(txt){
  const fl=txt.split('\n',1)[0],cnt={',':0,';':0,'\t':0};for(const c of fl)if(c in cnt)cnt[c]++;
  const d=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.map(r=>r.map(x=>{x=x.trim();return x===''?undefined:x}))
}
function serialJ(n){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return g2j(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())}
function parseDate(v){
  if(v==null||v==='')return null;
  let j=null;
  if(typeof v==='number'&&v>20000&&v<80000)j=serialJ(v);
  else{
    const s=toEn(v).trim();let d=s.split(/[^0-9]+/).filter(Boolean);
    if(d.length===1&&d[0].length===8)d=[d[0].slice(0,4),d[0].slice(4,6),d[0].slice(6,8)];
    if(d.length<3)return null;
    let y=+d[0],m=+d[1],dd=+d[2];
    if(d[0].length<=2&&d[2].length===4){y=+d[2];dd=+d[0]}
    if(y<100)y+=1400;
    if(m<1||m>12||dd<1||dd>31)return null;
    j=y>1700?g2j(y,m,dd):[y,m,dd];
  }
  return j[0]+'/'+pad(j[1])+'/'+pad(j[2]);
}
const ROLES=[['date','تاریخ',/تاریخ|date/i],['qty','تعداد',/تعداد|qty|quantity/i],['price','قیمت واحد',/قیمت|(^|\s)فی(\s|$)|واحد|price/i],['debit','برداشت / بدهکار',/برداشت|بدهکار|debit|withdraw/i],['credit','واریز / بستانکار',/واریز|بستانکار|credit|deposit/i],['amount','مبلغ',/مبلغ|جمع|کل|amount|total/i],['cat','دسته',/دسته|category/i],['title','شرح / عنوان',/شرح|عنوان|توضیح|بابت|نام|description|title|memo/i]];
function densify(r){return Array.from(r||[])}
function detectHdr(rows){
  for(let i=0;i<Math.min(15,rows.length);i++){const r=densify(rows[i]).filter(x=>x!=null&&x!=='');
    if(r.length>=2&&r.filter(x=>typeof x==='string'&&!/\d/.test(toEn(x))).length>=Math.ceil(r.length*.6))return i+1}
  return 0;
}
function autoMap(sh,hdr){
  const map={};ROLES.forEach(r=>map[r[0]]=null);
  if(hdr>0){const h=densify(sh.rows[hdr-1]),used=new Set();
    ROLES.forEach(([k,,re])=>{const c=h.findIndex((x,i)=>x!=null&&!used.has(i)&&re.test(String(x)));if(c>=0){map[k]=c;used.add(c)}})}
  return map;
}
function initSheet(i){
  imp.si=i;const sh=imp.sheets[i];imp.hdr=detectHdr(sh.rows);imp.map=autoMap(sh,imp.hdr);
  imp.mode=/درآمد/.test(sh.name)?'allinc':/هزینه/.test(sh.name)?'allexp':'sign';
}
$('impFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    let sheets;
    if(/\.xlsx$/i.test(f.name))sheets=await readXlsx(await f.arrayBuffer());
    else{const buf=await f.arrayBuffer();let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(_){txt=new TextDecoder('windows-1256').decode(buf)}
      sheets=[{name:'CSV',rows:csvParse(txt.replace(/^﻿/,''))}]}
    sheets=sheets.filter(s=>s.rows.length>0);
    if(!sheets.length)throw new Error('فایل خالی است');
    const exp=S.settings.expCats.map(c=>c.n),inc=S.settings.incCats;
    imp={file:f.name,sheets,skipDup:true,catExp:exp.includes('سایر')?'سایر':exp[exp.length-1],catInc:inc[inc.length-1]};
    initSheet(0);impRender();$('modal').classList.add('show');
  }catch(err){alert('خطا در خواندن فایل: '+err.message)}
};
function impResolve(){
  const sh=imp.sheets[imp.si],M=imp.map,out=[];let zero=0,noDate=0,dup=0;
  const seen=new Set();Object.values(S.months).forEach(m=>{m.exp.forEach(x=>seen.add('e|'+x.date+'|'+x.title+'|'+x.amount));m.inc.forEach(x=>seen.add('i|'+x.date+'|'+x.title+'|'+x.amount))});
  for(let ri=imp.hdr;ri<sh.rows.length;ri++){
    const r=densify(sh.rows[ri]);if(r.every(x=>x==null||x===''))continue;
    const g=k=>M[k]!=null?r[M[k]]:undefined;
    let type=null,amt=0;
    const pr=num(g('price')),q=g('qty')==null||g('qty')===''?1:(num(g('qty'))||1);
    if(M.debit!=null||M.credit!=null){const d=Math.abs(num(g('debit'))),c=Math.abs(num(g('credit')));if(d>0){type='exp';amt=d}else if(c>0){type='inc';amt=c}}
    else{let a=num(g('amount'));if(!a&&pr)a=pr*q;
      if(a){if(imp.mode==='allexp')type='exp';else if(imp.mode==='allinc')type='inc';else type=a<0?'exp':'inc';amt=Math.abs(a)}}
    if(!type||!amt){zero++;continue}
    let date=parseDate(g('date'));if(!date)noDate++;
    const item={type,date:date||defDate(S.cur),title:String(g('title')??'').trim(),amount:Math.round(amt*100)/100,cat:String(g('cat')??'').trim()||(type==='exp'?imp.catExp:imp.catInc)};
    if(type==='exp'){item.qty=q;item.price=(M.price!=null&&pr)?pr:Math.round(amt/q*100)/100}
    item.dup=seen.has((type==='exp'?'e|':'i|')+item.date+'|'+item.title+'|'+item.amount);if(item.dup)dup++;
    out.push(item);
  }
  return{items:out,zero,noDate,dup};
}
function impRender(){
  const sh=imp.sheets[imp.si],hdrRow=imp.hdr>0?densify(sh.rows[imp.hdr-1]):[];
  const ncol=Math.max(...sh.rows.slice(0,30).map(r=>densify(r).length),1);
  const opts=k=>`<option value="">— ندارد —</option>`+Array.from({length:ncol},(_,i)=>`<option value="${i}" ${imp.map[k]===i?'selected':''}>${esc(hdrRow[i]!=null?hdrRow[i]:'ستون '+fa(i+1))}</option>`).join('');
  const R=impResolve(),use=R.items.filter(x=>!(imp.skipDup&&x.dup));
  const se=use.filter(x=>x.type==='exp'),si=use.filter(x=>x.type==='inc');
  const hasDC=imp.map.debit!=null||imp.map.credit!=null;
  const rowsPv=R.items.slice(0,8).map(x=>`<tr><td class="c">${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.cat)}</td><td class="c">${x.type==='exp'?'<span class="bad">هزینه</span>':'<span class="good">درآمد</span>'}</td><td class="n">${x.type==='exp'?fmtP(x.price)+' × '+fmtP(x.qty):''}</td><td class="n"><b>${fmtP(x.amount)}</b></td></tr>${''}`).join('');
  const bx=$('modalBox'),st=bx.scrollTop;
  bx.innerHTML=`<h3>⬆ ورود اطلاعات حساب <small class="hint">${esc(imp.file)}</small></h3>
  <div class="grid2">
   ${imp.sheets.length>1?`<label class="fld">برگه (Sheet)<select data-imp="sheet">${imp.sheets.map((x,i)=>`<option value="${i}" ${i===imp.si?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}
   <label class="fld">ردیف عنوان ستون‌ها (۰ = بدون عنوان)<input data-imp="hdr" class="ltr" inputmode="numeric" value="${imp.hdr}"></label></div>
  <b style="font-size:13px">۱) تطبیق ستون‌ها</b><div class="hint">برنامه ستون‌ها را حدس زده؛ در صورت نیاز اصلاح کنید. برای «برداشت / واریز» دو ستون جدا، یا فقط یک ستون «مبلغ» انتخاب کنید.</div>
  <div class="mapg">${ROLES.map(([k,l])=>`<label class="fld">${l}<select data-imp="map" data-k="${k}">${opts(k)}</select></label>`).join('')}</div>
  <div class="mapg">
   <label class="fld">نوع تراکنش (برای ستون «مبلغ»)<select data-imp="mode" ${hasDC?'disabled':''}><option value="sign" ${imp.mode==='sign'?'selected':''}>بر اساس علامت (منفی = هزینه، مثبت = درآمد)</option><option value="allexp" ${imp.mode==='allexp'?'selected':''}>همه هزینه</option><option value="allinc" ${imp.mode==='allinc'?'selected':''}>همه درآمد</option></select></label>
   <label class="fld">دسته پیش‌فرض هزینه<select data-imp="catExp">${S.settings.expCats.map(c=>`<option ${c.n===imp.catExp?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label>
   <label class="fld">دسته پیش‌فرض درآمد<select data-imp="catInc">${S.settings.incCats.map(c=>`<option ${c===imp.catInc?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
  <b style="font-size:13px">۲) پیش‌نمایش</b>
  <div style="margin:6px 0"><span class="chip e">${fa(se.length)} هزینه: ${fmtP(sum(se))}</span><span class="chip i">${fa(si.length)} درآمد: ${fmtP(sum(si))}</span>${R.dup?`<span class="chip w">${fa(R.dup)} تکراری</span>`:''}${R.noDate?`<span class="chip w">${fa(R.noDate)} بدون تاریخ معتبر (به ماه جاری)</span>`:''}${R.zero?`<span class="chip">${fa(R.zero)} ردیف بدون مبلغ نادیده</span>`:''}</div>
  <div class="wrap"><table class="t pv"><thead><tr><th>تاریخ</th><th>شرح</th><th>دسته</th><th>نوع</th><th>قیمت × تعداد</th><th>مبلغ</th></tr></thead><tbody>${rowsPv||'<tr><td colspan="6" class="c">ردیفی پیدا نشد — ستون‌ها یا ردیف عنوان را بررسی کنید</td></tr>'}</tbody></table></div>
  <div class="hint">${R.items.length>8?'۸ ردیف اول نمایش داده شد. ':''}تاریخ‌های میلادی خودکار به شمسی تبدیل می‌شوند و هر ردیف در ماه خودش ثبت می‌شود.</div>
  <label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" data-imp="dup" ${imp.skipDup?'checked':''}> رد کردن ردیف‌های تکراری (هم‌تاریخ، هم‌شرح، هم‌مبلغ)</label>
  <div class="row"><button class="pri" data-imp="go" ${use.length?'':'disabled'}>ثبت ${fa(use.length)} ردیف</button><button data-imp="close">انصراف</button></div>`;
  bx.scrollTop=st;
}
$('modal').addEventListener('change',e=>{
  if(!imp)return;const t=e.target,k=t.dataset.imp;if(!k)return;
  if(k==='sheet')initSheet(+t.value);
  else if(k==='hdr'){imp.hdr=Math.max(0,parseInt(toEn(t.value))||0);imp.map=autoMap(imp.sheets[imp.si],imp.hdr)}
  else if(k==='map')imp.map[t.dataset.k]=t.value===''?null:+t.value;
  else if(k==='mode')imp.mode=t.value;
  else if(k==='catExp')imp.catExp=t.value;
  else if(k==='catInc')imp.catInc=t.value;
  else if(k==='dup')imp.skipDup=t.checked;
  impRender();
});
$('modal').addEventListener('click',e=>{
  const b=e.target.closest('button[data-imp]');if(!b||!imp)return;
  if(b.dataset.imp==='close'){imp=null;$('modal').classList.remove('show')}
  if(b.dataset.imp==='go'){
    const R=impResolve(),use=R.items.filter(x=>!(imp.skipDup&&x.dup));
    use.forEach(x=>{
      const[y,mo]=x.date.split('/').map(Number),m=ensureM(mkKey(y,mo));
      if(x.type==='exp'){if(!S.settings.expCats.some(c=>c.n===x.cat))S.settings.expCats.push({n:x.cat,b:0});
        m.exp.push({id:S.nid++,cat:x.cat,title:x.title,date:x.date,price:x.price,qty:x.qty,amount:x.amount,fix:false})}
      else{if(!S.settings.incCats.includes(x.cat))S.settings.incCats.push(x.cat);
        m.inc.push({id:S.nid++,cat:x.cat,title:x.title,date:x.date,amount:x.amount,fix:false})}});
    imp=null;$('modal').classList.remove('show');save();render();toast(fa(use.length)+' ردیف وارد شد');
  }
});

try{localStorage.setItem('last_section','personal')}catch(e){}
/* ================= شروع ================= */
if(!S.cur||!/^\d+-\d\d$/.test(S.cur))S.cur=todayKey();
ensureM(S.cur);save();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
